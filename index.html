<main><section class="summary" aria-label="확인 현황"><div><span>전체 묶음</span><strong id="total">—</strong></div><div><span>확인 완료</span><strong id="done">—</strong></div><div><span>남은 묶음</span><strong id="left">—</strong></div><div class="progress"><span id="percent">0% 확인</span><progress id="progress" value="0" max="100"></progress></div></section>

const REPO='JUSIETY/kwselRkRdl',KEY='jandi-check-v1';
let checks={},photos=[],bundles=[],filter='all',current=0,visible=[],viewerPhotos=[],viewerBundle=null,selectedDate=null;
const complete=b=>b.items.every(p=>checks[p.path]);
async function loadMandalart(){

try{let data;try{const response=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/framework/info.json',{cache:'no-store'});if(!response.ok)throw Error();data=await response.json();if(!data.mandalart?.progress)throw Error()}catch{data={updatedAt:'2026-10-17T02:52:51.579Z',mandalart:{progress:{total:108,completed:2,percent:2}}}}
const info=data.mandalart,p=info.progress,percent=Math.min(100,Math.max(0,Number(p.percent)||0));section.replaceChildren();const head=el('div','mandalart-head'),title=el('div');title.append(el('small','','만다라트'),el('h2','','진행도'));head.append(title,el('strong','',percent+'%'));const bar=el('progress');bar.max=100;bar.value=percent;bar.setAttribute('aria-label','만다라트 진행률');const caption=el('div','mandalart-caption');caption.append(el('span','',p.total+'개 중 '+p.completed+'개 완료'));if(data.updatedAt){const time=new Date(data.updatedAt);if(!isNaN(time))caption.append(el('small','','데이터 갱신 '+time.toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})))}section.append(head,bar,caption);
}catch{section.textContent='만다라트 진행률을 불러오지 못했습니다. 새로고침해 주세요.'}}
const pagePositions=new Map();
function addCarousel(card,b,thumb,img){
const key=b.date+'|'+b.name;let position=Math.min(pagePositions.get(key)||0,b.items.length-1);
const controls=el('div','carousel-controls'),prev=el('button','carousel-arrow','←'),next=el('button','carousel-arrow','→'),count=el('span');
prev.setAttribute('aria-label',b.name+' 이전 사진');next.setAttribute('aria-label',b.name+' 다음 사진');controls.append(prev,count,next);
function update(){pagePositions.set(key,position);img.src=b.items[position].url;img.alt=b.items[position].name;count.textContent=(position+1)+' / '+b.items.length;prev.disabled=position===0;next.disabled=position===b.items.length-1;thumb.querySelector('span').textContent='확대 보기 ↗';}
prev.onclick=()=>{if(position>0){position--;update()}};next.onclick=()=>{if(position<b.items.length-1){position++;update()}};
thumb.onclick=()=>{openBundle(b);current=position;showPhoto()};let start=null;
thumb.addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
thumb.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){if(dx<0&&position<b.items.length-1)position++;else if(dx>0&&position>0)position--;update();}},{passive:true});card.append(controls);update();}
function makeBundles(){const map=new Map();for(const p of photos){const name=p.name.replace(/\s*\d+$/,'').trim()||p.name;const key=p.date+'|'+name;if(!map.has(key))map.set(key,{name,date:p.date,items:[]});map.get(key).items.push(p)}bundles=[...map.values()];bundles.forEach(b=>b.items.sort((a,b)=>collator.compare(a.name,b.name)));}
function checkBundle(b,value){b.items.forEach(p=>value?checks[p.path]=true:delete checks[p.path]);save();}
try{checks=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
const $=s=>document.querySelector(s),collator=new Intl.Collator('ko',{numeric:true});
function parse(path){const parts=path.split('/'),m=path.match(/^(\d{2,4})\s+(\d{1,2})\/(\d{1,2})\//);return {path,name:parts.at(-1).replace(/\.[^.]+$/,''),date:m?(m[1].length===2?'20':'')+m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):'날짜 미지정',url:'https://raw.githubusercontent.com/'+REPO+'/main/'+path.split('/').map(encodeURIComponent).join('/')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(checks));$('#notice').textContent=''}catch{$('#notice').textContent='저장 공간을 사용할 수 없습니다. 체크 백업을 이용해 주세요.'}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function render(){const done=bundles.filter(complete).length;$('#total').textContent=bundles.length;$('#done').textContent=done;$('#left').textContent=bundles.length-done;const pct=bundles.length?Math.round(done/bundles.length*100):0;$('#percent').textContent=pct+'% 확인';$('#progress').value=pct;
const query=$('#search').value.trim().toLowerCase();visible=bundles.filter(b=>(filter==='all'||(filter==='done'?complete(b):!complete(b)))&&b.name.toLowerCase().includes(query));const groups=visible.reduce((o,b)=>((o[b.date]??=[]).push(b),o),{});
const allDates=[...new Set(photos.map(p=>p.date))];$('#board').replaceChildren();const dates=allDates.sort((a,b)=>a==='날짜 미지정'?1:b==='날짜 미지정'?-1:$('#order').value==='desc'?b.localeCompare(a):a.localeCompare(b));if(!selectedDate)selectedDate=dates[0]||null;
let dateNav=$('#dates');if(!dateNav){dateNav=el('nav','date-tabs');dateNav.id='dates';dateNav.setAttribute('aria-label','날짜 선택');$('#board').before(dateNav)}dateNav.replaceChildren();
const dateLabel=el('label','calendar-label','날짜 선택'),dateInput=el('input','calendar-input');dateInput.type='date';dateInput.setAttribute('aria-label','사진 날짜 선택');dateInput.value=selectedDate==='날짜 미지정'?'':selectedDate||'';dateInput.onchange=()=>{if(dateInput.value){selectedDate=dateInput.value;render()}};dateLabel.append(dateInput);const openCalendar=el('button','','📅 캘린더');openCalendar.type='button';openCalendar.onclick=()=>{if(dateInput.showPicker)dateInput.showPicker();else dateInput.focus()};dateNav.append(dateLabel,openCalendar);if(dates.includes('날짜 미지정')){const undated=el('button',selectedDate==='날짜 미지정'?'active':'','날짜 미지정');undated.onclick=()=>{selectedDate='날짜 미지정';render()};dateNav.append(undated)}

for(const date of selectedDate?[selectedDate]:[]){const items=(groups[date]||[]).sort((a,b)=>collator.compare(a.name,b.name));const col=el('section','column'),head=el('div','colhead'),title=el('div');title.append(el('h2','',date==='날짜 미지정'?'날짜 미지정':date.replaceAll('-','. ')),el('small','',items.filter(complete).length+' / '+items.length+'묶음 확인'));const batch=el('button','',items.length&&items.every(complete)?'전체 체크 해제':'전체 확인');batch.disabled=!items.length;batch.onclick=()=>{const value=!items.every(complete);items.forEach(b=>checkBundle(b,value));render()};head.append(title,batch);col.append(head);
for(const b of items){const card=el('article','card'+(complete(b)?' checked':'')),thumb=el('button','thumb'),img=el('img');img.src=b.items[0].url;img.alt=b.name;img.loading='lazy';thumb.setAttribute('aria-label',b.name+' '+b.items.length+'장 보기');thumb.append(img,el('span','',b.items.length+'장 · 펼쳐 보기 ↗'));const foot=el('div','cardfoot'),label=el('label'),check=el('input');check.type='checkbox';check.checked=complete(b);check.indeterminate=!complete(b)&&b.items.some(p=>checks[p.path]);check.setAttribute('aria-label',b.name+' 묶음 확인');check.onchange=()=>{checkBundle(b,check.checked);render()};label.append(check,document.createTextNode('확인'));foot.append(el('b','',b.name),label);card.append(foot,thumb);addCarousel(card,b,thumb,img);label.classList.add('card-confirm');card.querySelector('.carousel-controls').append(label);col.append(card)}if(!items.length)col.append(el('div','empty',allDates.includes(date)?'조건에 맞는 묶음이 없습니다.':'이 날짜에 등록된 사진이 없습니다.'));$('#board').append(col)}if(!dates.length)$('#board').append(el('div','empty','등록된 사진이 없습니다.'));}
function openBundle(b){viewerBundle=b;viewerPhotos=b.items;current=0;showPhoto();$('#viewer').showModal()}
function showPhoto(){const p=viewerPhotos[current];if(!p)return;$('#viewname').textContent=viewerBundle.name+' · '+(current+1)+' / '+viewerPhotos.length;$('#viewdate').textContent=p.date;$('#full').src=p.url;$('#full').alt=p.name;$('#viewcheck').checked=complete(viewerBundle);$('#prev').disabled=current<=0;$('#next').disabled=current>=viewerPhotos.length-1;$('.imagewrap').scrollTop=0}
$('#viewcheck').onchange=()=>checkBundle(viewerBundle,$('#viewcheck').checked);$('#close').onclick=()=>$('#viewer').close();$('#viewer').addEventListener('close',render);$('#prev').onclick=()=>{current--;showPhoto()};$('#next').onclick=()=>{current++;showPhoto()};document.addEventListener('keydown',e=>{if(!$('#viewer').open)return;if(e.key==='ArrowRight'&&current<viewerPhotos.length-1){current++;showPhoto()}if(e.key==='ArrowLeft'&&current>0){current--;showPhoto()}});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('#search').oninput=render;$('#order').onchange=render;
async function load(){const notice=$('#notice');notice.textContent='사진 목록을 불러오는 중…';try{const r=await fetch('https://api.github.com/repos/'+REPO+'/git/trees/main?recursive=1');if(!r.ok)throw Error();const data=await r.json();if(data.truncated)throw Error();photos=data.tree.filter(x=>x.type==='blob'&&/\.(jpe?g|png|webp|gif)$/i.test(x.path)).map(x=>parse(x.path));makeBundles();render();notice.textContent=''}catch{notice.textContent='목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.'}}
$('#refresh').onclick=()=>{load();loadMandalart()};$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,repo:REPO,checks},null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='잔디-체크-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.repo!==REPO||data.version!==1||!data.checks||typeof data.checks!=='object'||Array.isArray(data.checks))throw Error();for(const p of photos){if(data.checks[p.path]===true)checks[p.path]=true}save();render();$('#notice').textContent='백업한 확인 체크를 불러왔습니다.'}catch{$('#notice').textContent='올바른 잔디 체크 백업 파일을 선택해 주세요.'}e.target.value=''};window.addEventListener('storage',e=>{if(e.key===KEY){try{checks=JSON.parse(e.newValue||'{}');render()}catch{}}});load();loadMandalart();
</script></body></html>
